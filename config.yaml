run:
    cases: [woodward_colella]

defaults:
    mesh:
        type: structured
        dim: 2
        cells:
            x: 100
            y: 3
            z: 1
        domain:
            x: 1.0
            y: 1.0
            z: 1.0

    physics:
        eos: ideal_gas
        parameters:
            gamma: 1.4

    numerics:
        method: godunov-kolgan
        parameters:
            time_integrator: euler
            reconstruction: p1
            riemann_solver: hllc
            cfl: 0.2
            global_limiter: false
            viscosity: false
            diffusion: false

    boundary_conditions:
        x_min: reflective
        x_max: reflective
        y_min: outlet
        y_max: outlet

        states:
            x_min:
                rho: 5.0
                u: 10.0
                v: 0.0
                w: 0.0
                p: 1.0
            y_min:
                rho: 1.0
                u: 0.0
                v: 0.5
                w: 0.0
                p: 1.0
            y_max:
                rho: 1.0
                u: 0.0
                v: -0.5
                w: 0.0
                p: 1.0

    immersed_boundaries:
        enabled: false
        objects: []

    parallel:
        mpi: false

    stopping:
        t_end: 0.25
        max_steps: 0

    logging:
        every_steps: 10
        every_time: 0.0

    output:
        format: vtk
        directory: ../result
        every_steps: 100
        every_time: 0.0

cases:
    woodward_colella:
        mesh:
            type: gmsh_geo
            dim: 2
            source:
                file: ../data/Woodward_Colella.geo

        physics:
            eos: ideal_gas
            parameters:
                gamma: 1.4

        numerics:
            parameters:
                cfl: 0.4

        boundary_conditions:
            tags:
                1:
                    type: inlet
                    state:
                        rho: 1.4
                        u: 3.0
                        v: 0.0
                        w: 0.0
                        p: 1.0
                2:
                    type: outlet
                3:
                    type: wall

        initial_condition:
            type: constant
            rho: 1.4
            u: 3.0
            v: 0.0
            w: 0.0
            p: 1.0

        stopping:
            t_end: 4.0

        output:
            every_steps: 100

        parallel:
            mpi: true
            decomposition: metis

    naca:
        boundary_conditions:
            tags:
                1:
                    type: inlet
                    state:
                        rho: 1.0
                        u: 0.2
                        v: 0.0
                        w: 0.0
                        p: 1.0
                2:
                    type: outlet
                3:
                    type: outlet
                4:
                    type: wall


        initial_condition:
            type: constant
            rho: 1.0
            u: 0.2
            v: 0.0
            w: 0.0
            p: 1.0

        mesh:
            type: gmsh_geo
            dim: 2
            source:
                file: ../data/NACA_0012.geo

        stopping:
            t_end: 0.12

        parallel:
            mpi: true

    cylinder:
        boundary_conditions:
            tags:
                1:
                    type: inlet
                    state:
                        rho: 1.0
                        u: 0.2
                        v: 0.0
                        w: 0.0
                        p: 1.0
                2:
                    type: outlet
                3:
                    type: free_stream
                    state:
                        rho: 1.0
                        u: 0.2
                        v: 0.0
                        w: 0.0
                        p: 1.0
                4:
                    type: wall

        initial_condition:
            type: constant
            rho: 1.0
            u: 0.2
            v: 0.0
            w: 0.0
            p: 1.0

        mesh:
            type: gmsh_file
            dim: 2
            source:
                file: ../data/cylinder.msh

        stopping:
            t_end: 10

    sod1:
        initial_condition:
            type: structured_regions
            interfaces:
                x: [0.5]
                y: []
                z: []
            rho: [1.0, 0.125]
            u:   [0.0, 0.0]
            v:   [0.0, 0.0]
            w:   [0.0, 0.0]
            p:   [1.0, 0.1]
        stopping:
            t_end: 0.25

    sod1_2d:
        mesh:
            dim: 2
            cells:
                x: 100
                y: 3
                z: 1
        initial_condition:
            type: structured_regions
            interfaces:
                x: [0.5]
                y: []
                z: []
            rho: [1.0, 0.125]
            u:   [0.0, 0.0]
            v:   [0.0, 0.0]
            w:   [0.0, 0.0]
            p:   [1.0, 0.1]
        output:
            every_steps: 20
        stopping:
            t_end: 0.25

    sod1_2d_y:
        mesh:
            dim: 2
            cells:
                x: 200
                y: 200
                z: 1
        initial_condition:
            type: structured_regions
            interfaces:
                x: []
                y: [0.5]
                z: []
            rho:
                - 1.0
                - 0.125
            u:
                - 0.0
                - 0.0
            v:
                - 0.0
                - 0.0
            w:
                - 0.0
                - 0.0
            p:
                - 1.0
                - 0.1
        output:
            every_steps: 100
        stopping:
            t_end: 0.25

    lax_liu_3:
        mesh:
            dim: 2
            cells:
                x: 400
                y: 400
                z: 1
            domain:
                x: 1.0
                y: 1.0
                z: 1.0
        physics:
            eos: ideal_gas
            parameters:
                gamma: 1.4
        numerics:
            parameters:
                cfl: 0.4
        boundary_conditions:
            x_min: reflective
            x_max: reflective
            y_min: reflective
            y_max: reflective
        initial_condition:
            type: structured_regions
            interfaces:
                x: [0.5]
                y: [0.5]
                z: []
            rho:
                - [0.138, 0.5323]
                - [0.5323, 1.5]
            u:
                - [1.206, 1.206]
                - [0.0,   0.0]
            v:
                - [1.206, 0.0]
                - [1.206, 0.0]
            w:
                - [0.0, 0.0]
                - [0.0, 0.0]
            p:
                - [0.029, 0.3]
                - [0.3,   1.5]
        output:
            every_steps: 20
        stopping:
            t_end: 1.5

    lax_liu_12:
        mesh:
            dim: 2
            cells:
                x: 400
                y: 400
                z: 1
        physics:
            eos: ideal_gas
            parameters:
                gamma: 1.4
        numerics:
            parameters:
                cfl: 0.4
        boundary_conditions:
            x_min: reflective
            x_max: reflective
            y_min: reflective
            y_max: reflective
        initial_condition:
            type: structured_regions
            interfaces:
                x: [0.5]
                y: [0.5]
                z: []
            rho:
                - [1.0, 0.8]
                - [1.0, 0.8]
            u:
                - [0.0, 0.0]
                - [0.7276, 0.0]
            v:
                - [0.7276, 0.0]
                - [0.0,    0.0]
            w:
                - [0.0, 0.0]
                - [0.0, 0.0]
            p:
                - [1.0, 1.0]
                - [1.0, 1.0]
        output:
            every_steps: 200
        stopping:
            t_end: 0.25
